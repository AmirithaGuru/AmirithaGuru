<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0c2a" />
      <stop offset="45%" stop-color="#1b1f4b" />
      <stop offset="100%" stop-color="#3a2d63" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9e8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fff3d6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fff3d6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="petalGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd9e8" />
      <stop offset="100%" stop-color="#ff9ec4" />
    </radialGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#nightSky)" />

  <!-- twinkling stars -->
  <circle cx="80" cy="35" r="1.6" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0s" repeatCount="indefinite" /></circle>
  <circle cx="150" cy="70" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.4s" begin="0.3s" repeatCount="indefinite" /></circle>
  <circle cx="230" cy="30" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" begin="0.6s" repeatCount="indefinite" /></circle>
  <circle cx="330" cy="55" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" begin="1s" repeatCount="indefinite" /></circle>
  <circle cx="480" cy="25" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="0.2s" repeatCount="indefinite" /></circle>
  <circle cx="720" cy="30" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.6s" begin="0.8s" repeatCount="indefinite" /></circle>
  <circle cx="860" cy="60" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.4s" begin="0.4s" repeatCount="indefinite" /></circle>
  <circle cx="980" cy="25" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.9s" begin="0.9s" repeatCount="indefinite" /></circle>
  <circle cx="1060" cy="55" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.1s" begin="0.1s" repeatCount="indefinite" /></circle>
  <circle cx="1130" cy="30" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.7s" begin="0.5s" repeatCount="indefinite" /></circle>
  <circle cx="1160" cy="80" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.3s" begin="0.7s" repeatCount="indefinite" /></circle>
  <circle cx="40" cy="90" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" begin="1.2s" repeatCount="indefinite" /></circle>

  <!-- moon with gentle glow pulse -->
  <circle cx="1080" cy="55" r="60" fill="url(#moonGlow)">
    <animate attributeName="r" values="55;65;55" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="55" r="26" fill="#fdf6e3" />
  <circle cx="1092" cy="46" r="24" fill="#1b1f4b" />

  <!-- sakura branch -->
  <path d="M0,60 C40,50 70,80 110,65" stroke="#5a3d52" stroke-width="4" fill="none" opacity="0.7" />

  <!-- blossoms on branch, gently swaying -->
  <g transform="translate(60,45) scale(0.8)">
    <animateTransform attributeName="transform" type="rotate" values="-4 60 45; 4 60 45; -4 60 45" dur="4s" repeatCount="indefinite" additive="sum" />
    <ellipse cx="0" cy="-8" rx="6" ry="9" fill="url(#petalGrad)" />
    <ellipse cx="7" cy="-3" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(72 7 -3)" />
    <ellipse cx="4" cy="6" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(144 4 6)" />
    <ellipse cx="-4" cy="6" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(216 -4 6)" />
    <ellipse cx="-7" cy="-3" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(288 -7 -3)" />
    <circle cx="0" cy="0" r="3" fill="#ffe14d" />
  </g>
  <g transform="translate(95,75) scale(0.5) rotate(20)">
    <animateTransform attributeName="transform" type="rotate" values="16 95 75; 24 95 75; 16 95 75" dur="3.5s" repeatCount="indefinite" additive="sum" />
    <ellipse cx="0" cy="-8" rx="6" ry="9" fill="url(#petalGrad)" />
    <ellipse cx="7" cy="-3" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(72 7 -3)" />
    <ellipse cx="4" cy="6" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(144 4 6)" />
    <ellipse cx="-4" cy="6" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(216 -4 6)" />
    <ellipse cx="-7" cy="-3" rx="6" ry="9" fill="url(#petalGrad)" transform="rotate(288 -7 -3)" />
    <circle cx="0" cy="0" r="3" fill="#ffe14d" />
  </g>

  <!-- falling + drifting petals -->
  <ellipse cx="200" cy="130" rx="5" ry="8" fill="url(#petalGrad)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0; 15,90; 0,0" dur="7s" begin="0s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="30;390" dur="7s" begin="0s" repeatCount="indefinite" additive="sum" />
  </ellipse>
  <ellipse cx="340" cy="45" rx="4" ry="7" fill="url(#petalGrad)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; -10,160; 0,0" dur="9s" begin="1.5s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="-20;340" dur="9s" begin="1.5s" repeatCount="indefinite" additive="sum" />
  </ellipse>
  <ellipse cx="900" cy="130" rx="5" ry="8" fill="url(#petalGrad)" opacity="0.75">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,80; 0,0" dur="6.5s" begin="0.8s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="60;420" dur="6.5s" begin="0.8s" repeatCount="indefinite" additive="sum" />
  </ellipse>
  <ellipse cx="640" cy="35" rx="4" ry="7" fill="url(#petalGrad)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0; -12,170; 0,0" dur="10s" begin="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="10;370" dur="10s" begin="2s" repeatCount="indefinite" additive="sum" />
  </ellipse>
  <ellipse cx="770" cy="90" rx="4" ry="7" fill="url(#petalGrad)" opacity="0.65">
    <animateTransform attributeName="transform" type="translate" values="0,0; 10,110; 0,0" dur="8s" begin="0.4s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="-45;315" dur="8s" begin="0.4s" repeatCount="indefinite" additive="sum" />
  </ellipse>
  <ellipse cx="150" cy="150" rx="4" ry="6" fill="url(#petalGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0; 8,60; 0,0" dur="6s" begin="1.2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="80;440" dur="6s" begin="1.2s" repeatCount="indefinite" additive="sum" />
  </ellipse>

  <!-- gently moving wave -->
  <path fill="#0b0c2a" opacity="0.7">
    <animate attributeName="d"
             values="
               M0,190 C300,220 900,160 1200,195 L1200,220 L0,220 Z;
               M0,195 C300,165 900,215 1200,185 L1200,220 L0,220 Z;
               M0,190 C300,220 900,160 1200,195 L1200,220 L0,220 Z"
             dur="6s" repeatCount="indefinite" />
  </path>

  <text x="600" y="112" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700"
        fill="#ffffff" text-anchor="middle">
    Amirithavarshini Gurupandian
  </text>

  <text x="600" y="156" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400"
        fill="#e6d9f5" text-anchor="middle">
    DevSecOps Engineer | Cloud Security &amp; Detection Engineering
  </text>
</svg>
